# Formatting for rendered résumés and cover letters, in one place.
# pipeline/scripts/package/render_docx.py reads `docx` (résumés and cover letters); pipeline/scripts/package/render_pdf.py reads `pdf`.
# Units: size and spacing in points, margins in inches, line_spacing as a multiple of the font size,
# color as 6-digit hex RGB. Every value here is applied; nothing falls back to Word's or ReportLab's defaults,
# except the .docx bullet indent, which comes from Word's List Bullet numbering.
# Rules these values must keep: specs/ats-formatting-spec.md (one standard font, body 10–12pt, never shrunk to fit).

# One font for both formats. The PDF embeds it from /System/Library/Fonts/Supplemental/<font>.ttf
# (plus '<font> Bold.ttf', '<font> Italic.ttf', '<font> Bold Italic.ttf').
font: Arial

docx:
  margins: { top: 0.75, bottom: 0.75, left: 0.75, right: 0.75 }
  body:
    {
      size: 11,
      bold: false,
      color: "000000",
      line_spacing: 1.15,
      space_before: 0,
      space_after: 10,
    }
  h1:
    {
      size: 14,
      bold: true,
      color: "365F91",
      line_spacing: 1.15,
      space_before: 24,
      space_after: 0,
    }
  h2:
    {
      size: 13,
      bold: true,
      color: "4F81BD",
      line_spacing: 1.15,
      space_before: 10,
      space_after: 0,
    }
  h3:
    {
      size: 11,
      bold: true,
      color: "4F81BD",
      line_spacing: 1.15,
      space_before: 10,
      space_after: 0,
    }

pdf:
  margins: { top: 0.7, bottom: 0.7, left: 0.75, right: 0.75 }
  body:
    {
      size: 10,
      bold: false,
      color: "000000",
      line_spacing: 1.25,
      space_before: 0,
      space_after: 3,
    }
  h1:
    {
      size: 18,
      bold: true,
      color: "365F91",
      line_spacing: 1.2,
      space_before: 0,
      space_after: 2,
    }
  h2:
    {
      size: 11.5,
      bold: true,
      color: "4F81BD",
      line_spacing: 1.25,
      space_before: 7,
      space_after: 3,
    }
  h3:
    {
      size: 10,
      bold: true,
      color: "4F81BD",
      line_spacing: 1.25,
      space_before: 5,
      space_after: 2,
    }
  bullet: { char: "•", indent: 12 }
