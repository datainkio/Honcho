# ══════════════════════════════════════════════════════════════════════════════
# Job Search Criteria
# ══════════════════════════════════════════════════════════════════════════════
# Copy to config/search-criteria.yaml (/job-setup does this) and edit. Field
# names and allowed values are in config/README.md. Each search's `name`
# becomes the staged note's `source_search`, so keep names unique.
# ══════════════════════════════════════════════════════════════════════════════

# ── Sources ───────────────────────────────────────────────────────────────────
# Jobgether (public search API, no login) is on by default. LinkedIn, Indeed and
# UI/UX Jobs Board are opt-in: each is read through a logged-in or scripted route
# that its terms of service restrict (D17). Turn one on only if you accept that
# risk for your own account.
sources:
  linkedin: { enabled: false }
  jobgether: { enabled: true }
  indeed: { enabled: false }
  uiux: { enabled: false }

# ── Fit check ─────────────────────────────────────────────────────────────────
# What the job-fetcher keeps after reading a description, every source.
fit:
  targets: <the role families you want, in one sentence>
  location: <for example 'remote in the US'>
  skip:
    - <a kind of role a search returns that you never want>

# ══════════════════════════════════════════════════════════════════════════════
# LinkedIn (the top-level defaults, searches and selection blocks)
# ══════════════════════════════════════════════════════════════════════════════
defaults:
  max_pages: 3 # 1–10
  sort_by: date # date | relevance
  easy_apply: false
  date_posted: past_week # past_hour | past_24_hours | past_week | past_month

searches:
  - name: example-title-remote
    keywords: "<job title>"
    location: "Remote"
    work_type: [remote]
    experience_level: [mid_senior, director]
    job_type: [full_time, contract]

# Shared by every source unless a source's own selection block overrides it.
selection:
  max_fetches_per_run: 50
  fetch_delay_seconds: 8 # human-paced spacing between LinkedIn calls
  skip_if_already_retrieved: true
  batch_size: 10 # jobs per job-fetcher subagent
  exclude_title_terms: [] # titles containing any of these are dropped before fetching

# ══════════════════════════════════════════════════════════════════════════════
# Jobgether
# ══════════════════════════════════════════════════════════════════════════════
# `keyword` takes no boolean operators: one phrase per search. Names carry `jg-`.
jobgether:
  defaults:
    locations: [united-states, anywhere]
    remoteType: full-remote
    experience: [senior-5-10-years, expert-10-years]
    contractType: [full-time, freelance]
    sort: date # relevance | date
    limit: 25 # per page; the API maximum
    max_pages: 2 # 1–10

  searches:
    - { name: jg-example-title, keyword: "<job title>" }

  selection:
    max_fetches_per_run: 25
    fetch_delay_seconds: 2 # Jobgether's robots.txt Crawl-delay
    skip_if_already_retrieved: true

# ══════════════════════════════════════════════════════════════════════════════
# Indeed (opt-in)
# ══════════════════════════════════════════════════════════════════════════════
indeed:
  defaults:
    location: Remote
    fromage: 7 # days since posted: 1 | 3 | 7 | 14
    sort: date # date | relevance
    max_pages: 1

  searches:
    - { name: ind-example-title, keywords: "<job title>" }

  selection:
    max_fetches_per_run: 25
    fetch_delay_seconds: 8 # between every Indeed page load
    skip_if_already_retrieved: true

# ══════════════════════════════════════════════════════════════════════════════
# UI/UX Jobs Board (opt-in; design roles only)
# ══════════════════════════════════════════════════════════════════════════════
# Each search is a location page, https://uiuxjobsboard.com/design-jobs/<slug>.
uiux:
  defaults:
    max_age_days: 7
    max_pages: 1

  searches:
    - { name: uiux-remote-us, slug: remote-united-states }

  selection:
    max_fetches_per_run: 25
    fetch_delay_seconds: 5 # the script enforces it
    skip_if_already_retrieved: true
    exclude_types: [Internship]
